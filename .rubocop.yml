AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Exclude:
    - "test/dummy/**/*"
    - "vendor/**/*"
    - "bin/**/*"

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

Metrics/ClassLength:
  Exclude:
    - "test/**/*"

Metrics/MethodLength:
  Exclude:
    - "test/**/*"
    - "lib/generators/**/*"

Metrics/AbcSize:
  Exclude:
    - "test/**/*"
    - "lib/generators/**/*"

Lint/EmptyBlock:
  Exclude:
    - "test/**/*"

Lint/NestedMethodDefinition:
  Exclude:
    - "test/**/*"

Naming/VariableNumber:
  Exclude:
    - "test/**/*"
