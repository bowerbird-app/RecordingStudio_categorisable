AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Exclude:
    - 'test/dummy/**/*'
    - 'vendor/**/*'
    - 'bin/**/*'

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

# Relax metrics for test files, generators, and CRUD-heavy engine controllers.
Metrics/ClassLength:
  Exclude:
    - 'test/**/*'
    - 'lib/recording_studio_categorisable/hooks.rb'

Metrics/MethodLength:
  Exclude:
    - 'test/**/*'
    - 'lib/generators/**/*'
    - 'app/controllers/recording_studio_categorisable/category_groups_controller.rb'
    - 'app/controllers/recording_studio_categorisable/category_items_controller.rb'
    - 'app/controllers/recording_studio_categorisable/category_assignments_controller.rb'

Metrics/AbcSize:
  Exclude:
    - 'test/**/*'
    - 'lib/generators/**/*'
    - 'app/controllers/recording_studio_categorisable/category_groups_controller.rb'
    - 'app/controllers/recording_studio_categorisable/category_items_controller.rb'

Metrics/CyclomaticComplexity:
  Exclude:
    - 'app/controllers/recording_studio_categorisable/application_controller.rb'

# Allow empty blocks in tests (common for stubs/mocks)
Lint/EmptyBlock:
  Exclude:
    - 'test/**/*'

# Allow nested method definitions in tests (common for testing behavior)
Lint/NestedMethodDefinition:
  Exclude:
    - 'test/**/*'

# Allow underscores in test method names (test_something_100 is fine)
Naming/VariableNumber:
  Exclude:
    - 'test/**/*'

# Don't require super in service initialize methods
Lint/MissingSuper:
  Exclude:
    - 'lib/recording_studio_categorisable/services/**/*'
    - 'test/services/**/*'

Naming/PredicateMethod:
  Exclude:
    - "app/controllers/recording_studio_categorisable/application_controller.rb"
    - "app/models/recording_studio_categorisable/categorisable.rb"
